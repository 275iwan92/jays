<circle cx="738" cy="84" r="24" style="fill:#3d2a85;stroke:#fff;stroke-width:3"/><text class="t b" x="738" y="91" text-anchor="middle" style="fill:#fff;font-size:17px">AT</text>
<text class="t b" x="712" y="132">Agus (Teknisi)</text><text class="t s" x="712" y="148">Karyawan · E-0003</text>
