<rect x="21" y="41" width="188" height="30" rx="5" style="fill:#e4dcf7"/>
<text class="t b" x="34" y="61" style="fill:#3b2a7a">Agus (Teknisi)</text>
<text class="t s" x="196" y="61" text-anchor="end" style="fill:#3b2a7a">Maintenance</text>
<text class="t b" x="34" y="108" style="font-size:24px">3</text>
<text class="t s" x="34" y="126">dokumen pengeluaran</text>
<rect x="34" y="136" width="96" height="18" rx="9" style="fill:#e5e5e0"/><text class="t s" x="82" y="149" text-anchor="middle">Bukan karyawan</text>
