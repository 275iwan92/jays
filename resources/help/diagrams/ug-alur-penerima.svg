<text class="t b" x="789" y="216" text-anchor="middle">Sudah karyawan</text>
<text class="t s" x="450" y="244" text-anchor="middle">Warna pita mengikuti departemen. Penerima yang sudah tertaut punya tautan Karyawan di formnya.</text>
