<text class="t s" x="347.0" y="127" text-anchor="middle">(form Penerima)</text>
<line class="e" x1="434" y1="105" x2="482" y2="105" marker-end="url(#m-ug-alur-penerima)"/>
<rect class="n n-in" x="482" y="50" width="170" height="110" rx="10"/>
