<svg class="g-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="ug-alur-penerima-t ug-alur-penerima-d">
<title id="ug-alur-penerima-t">Penerima yang juga karyawan</title>
<desc id="ug-alur-penerima-d">Di form Penerima tekan tombol Jika penerima ini karyawan, klik di sini. Form Karyawan terbuka dengan nama dan bagian terisi. Setelah disimpan, penerima tertaut ke karyawan dan kartunya berubah bentuk.</desc>
